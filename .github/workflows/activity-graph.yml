# Profile Activity Graph Workflow
# .github/workflows/activity-graph.yml
name: Generate GitHub Activity Graph
on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Activity Graph
    steps:
      - uses: actions/checkout@v3

      - uses: Ashutosh00710/github-readme-activity-graph@v3
        with:
          github_user_name: vikas3000
          theme: react-dark
          hide_border: true
          bg_color: "00000000"

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v2.5.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}